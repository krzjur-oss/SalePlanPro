<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Full-bleed background for maskable (Android clips to circle/squircle) -->
  <rect width="100" height="100" fill="#0f172a"/>
  <!-- Decorative Grid Lines within safe zone -->
  <line x1="15" y1="35" x2="85" y2="35" stroke="#1e293b" stroke-width="1.2" />
  <line x1="15" y1="50" x2="85" y2="50" stroke="#1e293b" stroke-width="1.2" />
  <line x1="15" y1="65" x2="85" y2="65" stroke="#1e293b" stroke-width="1.2" />
  <line x1="35" y1="15" x2="35" y2="85" stroke="#1e293b" stroke-width="1.2" />
  <line x1="65" y1="15" x2="65" y2="85" stroke="#1e293b" stroke-width="1.2" />
  
  <!-- Glowing main emblem inside safe 70% inner circle (min 15% margin around edges) -->
  <rect x="27.5" y="27.5" width="45" height="45" rx="10" fill="url(#grad)" filter="url(#glow)" opacity="0.95"/>
  <!-- Letter text "SP" -->
  <text x="50" y="57.5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="-1">SP</text>
  <!-- Sparkle/Dot -->
  <circle cx="68" cy="32" r="3.5" fill="#fbbf24" filter="url(#glow)"/>
</svg>

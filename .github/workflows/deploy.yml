name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master # Triggers on main or master branches
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run E2E Persistence tests (requires clean persistence lifecycle)
        run: npm run test:e2e

      - name: Build application
        run: npm run build

      - name: Ensure .nojekyll exists
        run: touch dist/.nojekyll

      # 1. Oficjalne wdrożenie GitHub Pages (rozwiązuje błąd kroku deploy-pages)
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 2. Zapasowe wypchnięcie na gałąź gh-pages (jeśli w Settings wybrano 'Deploy from a branch')
      - name: Deploy to gh-pages branch (fallback)
        uses: JamesIves/github-pages-deploy-action@v4
        continue-on-error: true
        with:
          folder: dist
          branch: gh-pages
